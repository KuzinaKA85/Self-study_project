[tool.black]
line-length = 119
target-version = ['py313']
exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | \.env
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip_gitignore = true
known_django = "django"
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.flake8]
max-line-length = 119
extend-ignore = "E203, W503"
exclude = ".git,__pycache__,.venv,.env,migrations"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = "migrations/"